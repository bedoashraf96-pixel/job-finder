name: Update jobs

on:
  schedule:
    - cron: "0 4 * * *"      # every morning, 04:00 UTC (07:00 in the Gulf)
  workflow_dispatch:          # "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      - name: Search LinkedIn and build the site
        run: python3 update_jobs.py site "${{ steps.pages.outputs.base_url }}/jobs.json"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Keep the schedule alive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep daily updates running"
            git push
          else
            echo "Last commit is recent; nothing to do."
          fi
